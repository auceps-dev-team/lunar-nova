# Contenu CIBLE de .github/workflows/ci.yml (lot C5, v1.48.1) — prêt à coller.
#
# Constat H2 (plan v1.42.13) : le jeton GitHub App des contributions
# automatisées n'a pas la permission `workflows` et ne peut pas pousser une
# modification de workflow lui-même — la tentative de push est rejetée par
# GitHub. Ce fichier contient donc le workflow final intégral (job de build
# avec couverture + job e2e-smoke) : l'équipe éditrice n'a qu'à le copier tel
# quel vers .github/workflows/ci.yml (la modification est également prête
# dans la copie de travail du dépôt).

name: CI — WaCopilote

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main, 'arena/**']

defaults:
  run:
    working-directory: whatsapp-ai-saas

jobs:
  build-and-test:
    name: 🧪 Tests, Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: whatsapp-ai-saas/package-lock.json

      - name: 📦 Install root dependencies
        run: npm ci

      - name: 📦 Install backend dependencies
        run: npm ci
        working-directory: whatsapp-ai-saas/backend

      - name: 🧪 Run Vitest unit tests (couverture publiée, sans seuil bloquant)
        run: npx vitest run --reporter=verbose --coverage

      - name: 📤 Upload coverage report (lcov)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: whatsapp-ai-saas/coverage/lcov.info
          if-no-files-found: warn

      - name: 🔍 ESLint (zero warnings)
        run: npx eslint . --max-warnings=0

      - name: 🏗️ Vite build
        run: npx vite build

  e2e-smoke:
    name: 🖥️ Smoke E2E (Electron + xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-and-test]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            whatsapp-ai-saas/package-lock.json
            whatsapp-ai-saas/backend/package-lock.json

      - name: 📦 Installer xvfb et les bibliothèques système d'Electron
        working-directory: /tmp
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0

      - name: 📦 Installer les dépendances racine (scripts postinstall → binaire Electron)
        working-directory: whatsapp-ai-saas
        run: npm ci

      - name: 📦 Installer les dépendances backend
        working-directory: whatsapp-ai-saas/backend
        run: npm ci

      - name: 🏗️ Build du renderer
        working-directory: whatsapp-ai-saas
        run: npx vite build

      - name: 🖥️ Tests E2E smoke (xvfb)
        working-directory: whatsapp-ai-saas
        run: xvfb-run -a npm run test:e2e
